function calendar(){let first=new Date(calY,calM,1),start=(first.getDay()+6)%7,days=new Date(calY,calM+1,0).getDate(),cells=Array.from({length:start},()=>null).concat(Array.from({length:days},(_,i)=>localKey(new Date(calY,calM,i+1))));const dailySessions=sessionsFor(selectedDay);return `<div class="floating"><h1 class="heading">${months[calM]} ${calY}</h1><div class="btn-row"><button class="btn grey sm" data-action="month" data-delta="-1">‹</button><button class="btn grey sm" data-action="month" data-delta="1">›</button></div></div><div class="card"><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.map(k=>{if(!k)return '<div></div>';let ws=sessionsFor(k),ty=ws[0]?.type;return `<button class="calday ${ty||''} ${k===today()?'today':''} ${k===selectedDay?'selected':''}" data-action="select-day" data-date="${k}">${dateObj(k).getDate()}<span class="kind">${ws.length?(ty==='cardio'?'CARDIO':nameType[ty]?.replace('Day ','D')):''}</span></button>`}).join('')}</div></div><div class="legend"><span><i style="background:var(--lime)"></i>День 1</span><span><i style="background:var(--orange)"></i>День 2</span><span><i style="background:var(--purple)"></i>День 3</span><span><i style="background:var(--blue)"></i>Кардіо</span></div><div class="stats-grid"><div class="stat"><strong>${db.workouts.filter(w=>w.type!=='cardio').length}</strong><span class="muted small">Силових</span></div><div class="stat"><strong>${db.workouts.filter(w=>w.type==='cardio').length}</strong><span class="muted small">Кардіо</span></div></div><div class="card"><div class="floating"><div><div class="small muted">${E(dateNice(selectedDay))}</div><div class="card-title">Записи за день</div></div><button class="btn grey sm" data-action="add-past">+ Додати</button></div>${dailySessions.length?dailySessions.map(w=>`<div class="detailRow"><div><strong>${nameType[w.type]}</strong><div class="muted small">${Math.round(w.duration/60)} хв · ${w.type==='cardio'?`пульс ${w.heartRate||'—'}`:`${w.exercises.length} вправ`}</div></div><button class="btn grey sm" data-action="view-workout" data-id="${E(w.id)}">›</button></div>`).join(''):'<p class="muted small">Тренувань у цей день немає.</p>'}</div>`}
function weekData(index=0){let d=weekStart(today());d.setDate(d.getDate()+index*7);const dates=weekOf(localKey(d)),sessions=db.workouts.filter(w=>dates.includes(w.date)),weights=dates.map(k=>({k,value:db.days[k]?.weight})).filter(x=>x.value!==null&&x.value!==undefined&&x.value!=='');return{dates,sessions,weights,water:dates.map(k=>db.days[k]?.water||0),calories:dates.map(k=>db.days[k]?.calories||0)}}
let weekOffset=0;
function reports(){const z=weekData(weekOffset),str=z.sessions.filter(w=>w.type!=='cardio'),card=z.sessions.filter(w=>w.type==='cardio'),weights=Object.entries(db.days).filter(([k,v])=>v.weight!==null&&v.weight!==''&&Number.isFinite(+v.weight)).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7),values=weights.map(x=>Number(x[1].weight)),lo=Math.min(...values,0),hi=Math.max(...values,1),progress=[];for(const k of Object.keys(WORK.d1)){void k}const latest={};for(let w of db.workouts){for(let x of w.exercises||[]){const peak=Math.max(0,...x.sets.filter(s=>s.done).map(s=>Number(s.weight)||0));if(peak)latest[x.name]=peak}}return `<div class="floating"><div><div class="small muted">${z.dates[0]} – ${z.dates[6]}</div><h1 class="heading">Weekly report</h1></div><div class="btn-row"><button class="btn grey sm" data-action="week-shift" data-delta="-1">‹</button><button class="btn grey sm" data-action="week-shift" data-delta="1" ${weekOffset>=0?'disabled':''}>›</button></div></div><div class="stats-grid"><div class="stat"><div class="muted small">Силові</div><strong>${str.length} / 3</strong><span class="small muted">${Math.round(str.reduce((a,b)=>a+b.duration,0)/60)} хв</span></div><div class="stat"><div class="muted small">Кардіо</div><strong>${card.length} / 3</strong><span class="small muted">${Math.round(card.reduce((a,b)=>a+b.duration,0)/60)} хв</span></div><div class="stat"><div class="muted small">Вода в середньому</div><strong>${(z.water.reduce((a,b)=>a+b,0)/7000).toFixed(1)} л</strong><span class="small muted">за 7 днів</span></div><div class="stat"><div class="muted small">Калорії, якщо записані</div><strong>${z.calories.some(Boolean)?Math.round(z.calories.reduce((a,b)=>a+b,0)/z.calories.filter(Boolean).length):'—'}</strong><span class="small muted">ккал за день</span></div></div><div class="card"><div class="floating"><strong>Вага тіла</strong><span class="lime small">${values.length>1?(values.at(-1)-values[0]).toFixed(1)+' кг':'Потрібно 2+ записи'}</span></div>${weights.length?`<div class="bargraph">${weights.map((x,i)=>`<div class="column"><small>${Number(x[1].weight).toFixed(1)}</small><div class="stick ${i===weights.length-1?'last':''}" style="height:${Math.max(15,((Number(x[1].weight)-Math.min(...values)+1)/(Math.max(...values)-Math.min(...values)+2))*115)}px"></div><small>${x[0].slice(5)}</small></div>`).join('')}</div>`:'<div class="empty">Запиши вагу кілька разів, і тут з’явиться графік.</div>'}</div><div class="card"><div class="card-title">Останні робочі ваги</div>${Object.keys(latest).length?Object.entries(latest).slice(-7).reverse().map(([k,v])=>`<div class="detailRow"><span>${E(k)}</span><strong class="lime">${v} кг</strong></div>`).join(''):'<p class="muted small">Записи з’являться після тренувань.</p>'}</div><div class="card"><div class="floating"><div><div class="card-title">Фото прогресу</div><div class="small muted">Порівнюй фото за тижнями</div></div><button class="btn grey sm" data-action="photo">+ Фото</button></div>${db.photoMeta.length?`<div class="muted small" style="margin-top:10px">Збережено ${db.photoMeta.length} фото на цьому пристрої</div>`:'<div class="muted small" style="margin-top:10px">Фото ще немає.</div>'}</div><button class="btn grey" data-action="export">⇩ Експортувати весь щоденник JSON</button>`}
function nutrition(){let d=daily(selectedDay),checked=MEALS.slice(0,4).filter(m=>d.meals[m[0]]).length;return `<div class="floating"><h1 class="heading">Today's fuel</h1><input style="width:124px" class="input" type="date" id="nutritionDate" value="${selectedDay}" max="${today()}"></div><div class="waterbox"><div class="floating"><strong>Вода</strong><span class="small" style="color:#b5d3e5">Орієнтир 3 л · за потребою</span></div><div style="margin-top:10px"><strong>${(d.water/1000).toFixed(2)}</strong><span style="color:#97c4e2"> / 3 л</span></div><div class="blocks">${Array.from({length:12},(_,i)=>`<span class="${d.water>=((i+1)*250)?'on':''}"></span>`).join('')}</div><div class="btn-row"><button class="btn blue" data-action="water" data-delta="250">+250 мл</button><button class="btn blue" data-action="water" data-delta="500">+500 мл</button><button class="btn blue" data-action="water-custom">Своє</button></div><button class="link" style="color:#b5d3e5" data-action="water" data-delta="-250">−250 мл</button></div><div class="card"><div class="floating"><div><div class="small muted">Калорії · необов'язково</div><strong>${d.calories||0} ккал</strong></div><button class="btn grey sm" data-action="calories">+ Змінити</button></div></div><div class="card"><div class="floating"><div class="card-title">Харчування</div><span class="tag">${checked}/4</span></div>${MEALS.map(([id,title,info])=>`<label class="meal"><input type="checkbox" data-meal="${id}" ${d.meals[id]?'checked':''}><div style="flex:1"><strong>${title}</strong><div class="muted">${E(info)}</div></div></label>`).join('')}</div><div class="card"><div class="card-title">Добавки · відмічай лише погоджені</div><div class="supps">${SUPS.map(x=>`<label class="supp"><input type="checkbox" data-supp="${E(x)}" ${d.supps[x]?'checked':''}>${E(x)}</label>`).join('')}</div><div class="muted small">Вітамін D 5000 МО щодня — висока доза, приймай за медичними показаннями. Перевір сумарні дози ADAM і ZMA.</div></div><div class="card"><div class="field"><label for="bodyWeight">Вага тіла, кг</label><div class="btn-row"><input class="input" type="number" min="20" max="400" step="0.1" id="bodyWeight" value="${d.weight??''}" placeholder="Напр., 82.4"><button class="btn sm" data-action="save-body-weight">Записати</button></div></div></div>`}
const silhouette='<svg class="silhouette" width="175" height="220" viewBox="0 0 175 220" aria-hidden="true"><circle cx="88" cy="27" r="17" stroke="#777f83" fill="none" stroke-width="2"/><path d="M69 52h38l15 88H54z M65 61 36 112 M110 61 139 112 M75 140l-8 67 M100 140l8 67" stroke="#777f83" stroke-width="2.5" fill="none"/></svg>';
function photoScreen(){return `<div class="floating"><button class="roundbtn" data-action="tab" data-tab="reports">×</button><span class="tag">Weekly photo</span><span class="small muted">На цьому пристрої</span></div><h1 class="heading" style="margin-top:16px">Фото прогресу</h1><div class="photoView" id="photoView">${silhouette}</div><p class="muted small" style="text-align:center">Повторюй ту саму позу та освітлення кожного тижня</p><div class="pose">${[['front','Спереду'],['side','Збоку'],['back','Ззаду']].map(([k,label])=>`<button class="${photoPose===k?'active':''}" data-action="pose" data-pose="${k}">${label}</button>`).join('')}</div><input id="photoFile" type="file" accept="image/*" style="display:none"><button class="btn" data-action="photo-upload">📷 Вибрати або зняти фото</button><div class="card"><div class="card-title">Твої фото</div><div id="photoHistory" class="muted small">Завантаження...</div></div>`}
function workoutDetails(id){const w=db.workouts.find(w=>w.id===id);if(!w)return `<div class="empty">Запис не знайдено</div>`;return `<button class="btn grey sm" data-action="tab" data-tab="calendar">← Календар</button><h1 class="heading" style="margin-top:16px">${nameType[w.type]}</h1><div class="card"><div class="detailRow"><span>Дата</span><b>${w.date}</b></div><div class="detailRow"><span>Тривалість</span><b>${Math.round(w.duration/60)} хв</b></div>${w.type==='cardio'?`<div class="detailRow"><span>Середній пульс</span><b>${w.heartRate||'—'}</b></div>`:w.exercises.map(x=>`<div class="detailRow"><div><strong>${E(x.name)}</strong><div class="muted small">${x.sets.filter(v=>v.done).length}/${x.sets.length} підходів</div></div><span class="lime">${Math.max(0,...x.sets.filter(v=>v.done).map(v=>+v.weight||0))} кг</span></div>`).join('')}</div><button class="btn grey" data-action="delete-workout" data-id="${E(id)}">Видалити цей запис</button>`}
let detailId=null;
function render(){if(db.active){tab='workout';shell(activeWorkout());setClock();return}let body=tab==='home'?home():tab==='workout'?workoutPicker():tab==='calendar'?calendar():tab==='reports'?reports():tab==='nutrition'?nutrition():tab==='photo'?photoScreen():tab==='detail'?workoutDetails(detailId):home();shell(body);if(tab==='photo')loadPhotoHistory()}
function start(type){if(db.active){toast('Спочатку закінчи або скасуй поточне тренування');return}let s={type,date:today(),phase:type==='cardio'?'cardio':'warm',index:0,startedAt:Date.now(),elapsed:0,paused:false,warmStart:Date.now(),sets:{},weights:{},restEnd:null,heartRate:'',notes:''};db.active=s;save();tab='workout';render()}
function updateTime(){if(!db.active)return;let s=db.active;if(!s.paused){s.elapsed=getDurationLive();s.startedAt=Date.now()}save()}
function doneSet(idx=null){const s=db.active,a=WORK[s.type][s.index],i=idx===null?Array.from({length:a[1]},(_,j)=>j).find(j=>!s.sets[s.index]?.[j]?.done):idx;if(i===undefined){nextExercise();return}let ss=s.sets[s.index]||Array.from({length:a[1]},()=>({done:false,weight:0,reps:a[2]||0}));ss[i]={done:!ss[i]?.done,weight:Math.max(0,+s.weights[s.index]||0),reps:a[2]||0};s.sets[s.index]=ss;s.restEnd=ss[i].done?Date.now()+90000:null;save();render()}
function nextExercise(){let s=db.active;if(s.index<WORK[s.type].length-1){s.index++;s.restEnd=null}else{s.phase='done'}save();render()}
function finish(){const s=db.active;if(!s)return;let w={id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now()),type:s.type,date:s.date,finishedAt:Date.now(),duration:getDurationLive(),heartRate:s.heartRate||null,notes:s.notes||'',exercises:s.type==='cardio'?[]:WORK[s.type].map((x,i)=>({name:x[0],sets:Array.from({length:x[1]},(_,j)=>s.sets[i]?.[j]||{done:false,weight:0,reps:x[2]||0})}))};db.workouts.push(w);db.active=null;save();tab='home';render();toast('Тренування збережено в календарі ✓')}
function setTab(target){tab=target;render()}
function exportJson(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);a.href=url;a.download='forma-journal-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function photoDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('forma-photo-database',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storePhoto(file){try{let id=today()+'-'+photoPose,dbi=await photoDB();await new Promise((resolve,reject)=>{let tx=dbi.transaction('photos','readwrite');tx.objectStore('photos').put({id,file,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});if(!db.photoMeta.find(x=>x.id===id))db.photoMeta.push({id,date:today(),pose:photoPose});save();toast('Фото збережено лише на цьому пристрої');loadPhotoHistory()}catch(e){toast('Не вдалося зберегти фото')}}
async function loadPhotoHistory(){let el=$('photoHistory');if(!el)return;try{let database=await photoDB(),rows=await new Promise((resolve,reject)=>{let r=database.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});el.innerHTML=rows.length?rows.sort((a,b)=>b.createdAt-a.createdAt).map(r=>`<button class="btn grey sm" style="margin:4px" data-action="show-photo" data-id="${E(r.id)}">${E(r.id)}</button>`).join(''):'Фото ще немає';if(rows.length){let photo=rows.find(r=>r.id.endsWith(photoPose))||rows[0];showBlob(photo.file)}}catch(e){el.textContent='На цьому пристрої фото недоступні'}}
function showBlob(file){if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(file);let v=$('photoView');if(v)v.innerHTML=`<img alt="Фото прогресу" src="${photoUrl}">`}
async function openSavedPhoto(id){let datab=await photoDB();let r=datab.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>{if(r.result)showBlob(r.result.file)}}
function handleAction(btn){const a=btn.dataset.action;switch(a){case'tab':setTab(btn.dataset.tab);break;case'profile':{let name=prompt('Як тебе називати?',db.profile.name||'champ');if(name!==null){db.profile.name=name.trim().slice(0,25)||'champ';save();render()}break}case'open-picker':tab='workout';render();break;case'choose':chosen=btn.dataset.type;render();break;case'start':start(btn.dataset.type);break;case'exit':if(confirm('Вийти з тренування? Прогрес збережеться, можна повернутися.')){updateTime();db.active.paused=true;save();tab='home';// show home while active: render manually
shell(`<div class="small muted">Тренування на паузі</div><h1 class="heading">${nameType[db.active.type]}</h1><button class="btn" data-action="resume">▶ Продовжити</button><button class="btn grey" style="margin-top:12px" data-action="cancel">Скасувати тренування</button>`)}break;case'resume':db.active.paused=false;db.active.startedAt=Date.now();save();render();break;case'cancel':if(confirm('Скасувати незавершене тренування?')){db.active=null;save();tab='home';render()}break;case'pause':{const s=db.active;if(!s)return;if(s.paused){s.paused=false;s.startedAt=Date.now()}else{updateTime();s.paused=true}s.restEnd=null;save();render();break}case'warm-done':db.active.phase='sets';db.active.restEnd=null;save();render();break;case'weight-adjust':{const x=$('weight');const v=Math.max(0,(+x.value||0)+(+btn.dataset.delta));x.value=v;db.active.weights[db.active.index]=v;save();break}case'set':doneSet(+btn.dataset.set);break;case'set-done':doneSet();break;case'prev':db.active.index=Math.max(0,db.active.index-1);db.active.restEnd=null;save();render();break;case'next':nextExercise();break;case'finish':finish();break;case'video':window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(btn.dataset.query+' proper technique'),'_blank','noopener,noreferrer');break;case'water':{let v=daily(selectedDay);v.water=Math.max(0,Math.round((v.water+(+btn.dataset.delta))/50)*50);save();render();break}case'water-custom':{let n=prompt('Скільки мл додати? Наприклад, 350','350');if(n!==null&&Number.isFinite(+n)){daily(selectedDay).water=Math.max(0,daily(selectedDay).water+Math.round(+n));save();render()}break}case'calories':{let n=prompt('Калорії за весь день (ккал)',''+daily(selectedDay).calories);if(n!==null&&Number.isFinite(+n)){daily(selectedDay).calories=Math.max(0,Math.round(+n));save();render()}break}case'save-body-weight':{let n=+$('bodyWeight').value;if(n>20&&n<400){daily(selectedDay).weight=n;save();toast('Вагу записано');render()}else toast('Вкажи коректну вагу');break}case'month':calM+=+btn.dataset.delta;if(calM>11){calM=0;calY++}if(calM<0){calM=11;calY--}render();break;case'select-day':selectedDay=btn.dataset.date;render();break;case'week-shift':weekOffset=Math.min(0,Math.max(-52,weekOffset+(+btn.dataset.delta)));render();break;case'add-past':{let type=prompt('Введи курс: d1, d2, d3 або cardio','d1');if(!['d1','d2','d3','cardio'].includes(type))break;let minutes=+prompt('Скільки хвилин тривало тренування?','45');if(!(minutes>0&&minutes<600))break;db.workouts.push({id:String(Date.now()),type,date:selectedDay,finishedAt:dateObj(selectedDay).getTime(),duration:Math.round(minutes*60),exercises:type==='cardio'?[]:WORK[type].map(x=>({name:x[0],sets:[]}))});save();render();toast('Тренування додано');break}case'view-workout':detailId=btn.dataset.id;tab='detail';render();break;case'delete-workout':if(confirm('Видалити запис назавжди?')){db.workouts=db.workouts.filter(x=>x.id!==btn.dataset.id);save();tab='calendar';render()}break;case'export':exportJson();break;case'photo':tab='photo';render();break;case'pose':photoPose=btn.dataset.pose;render();break;case'photo-upload':$('photoFile')?.click();break;case'show-photo':openSavedPhoto(btn.dataset.id);break}}
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;if(['choose','open-picker','set','next'].includes(action))e.preventDefault();handleAction(btn)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='weight'&&db.active){db.active.weights[db.active.index]=Math.max(0,+t.value||0);save()}else if(t.id==='heartRate'&&db.active){db.active.heartRate=t.value;save()}else if(t.id==='cardioNotes'&&db.active){db.active.notes=t.value;save()}else if(t.dataset.meal){daily(selectedDay).meals[t.dataset.meal]=t.checked;save();render()}else if(t.dataset.supp){daily(selectedDay).supps[t.dataset.supp]=t.checked;save();render()}else if(t.id==='nutritionDate'){selectedDay=t.value;render()}else if(t.id==='photoFile'&&t.files[0]){storePhoto(t.files[0])}});
// Saving an in-progress session across reloads and hidden/background time.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db.active){updateTime()}});
window.addEventListener('beforeunload',()=>{if(db.active)updateTime()});
setInterval(()=>{if(db.active&&!db.active.paused){setClock();if(db.active.restEnd&&db.active.restEnd<=Date.now()){db.active.restEnd=null;save();let x=$('restRemaining');if(x)x.textContent='00:00'}}},1000);
if(db.active){tab='workout';if(!db.active.paused)db.active.startedAt=Date.now()};render();
</script></body></html>
